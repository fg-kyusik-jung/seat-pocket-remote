<title>Voltage Divider</title>
<style>
  :root {
    --bg: #f6f5f2;
    --surface: #ffffff;
    --ink: #23262b;
    --ink-dim: #6b7178;
    --line: #8a8f98;
    --wire: #2b2f36;
    --accent: #c8622a;
    --accent-soft: #f4e3d6;
    --danger: #b0392f;
    --safe: #3f7a5c;
    --border: #dedad2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1c1e;
      --surface: #232427;
      --ink: #ece9e4;
      --ink-dim: #9a9da3;
      --line: #7c828b;
      --wire: #d8d5cf;
      --accent: #e08a4f;
      --accent-soft: #3a2c22;
      --danger: #e07568;
      --safe: #6fbf94;
      --border: #33353a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1c1e;
    --surface: #232427;
    --ink: #ece9e4;
    --ink-dim: #9a9da3;
    --line: #7c828b;
    --wire: #d8d5cf;
    --accent: #e08a4f;
    --accent-soft: #3a2c22;
    --danger: #e07568;
    --safe: #6fbf94;
    --border: #33353a;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 28px 16px 40px;
    display: flex;
    justify-content: center;
  }
  main {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  h1 {
    font-size: 1.25rem;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .sub {
    color: var(--ink-dim);
    font-size: 0.9rem;
    margin-top: 4px;
  }
  figure {
    margin: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 16px 16px;
  }
  svg { width: 100%; height: auto; display: block; }
  figcaption {
    margin-top: 14px;
    font-size: 0.85rem;
    color: var(--ink-dim);
    line-height: 1.5;
  }
  .mono {
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  th, td {
    text-align: left;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
  }
  th {
    color: var(--ink-dim);
    font-weight: 600;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  tr:last-child td { border-bottom: none; }
  td.v { font-family: "JetBrains Mono", ui-monospace, monospace; }
  .tag {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 600;
  }
  .tag.danger { background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); }
  .tag.safe { background: color-mix(in srgb, var(--safe) 18%, transparent); color: var(--safe); }
</style>

<main>
  <div>
    <h1>저항분배기 (5V → 3.3V 레벨시프팅)</h1>
    <div class="sub">우노 TX → ESP32 RX 사이에 넣는 전압분배 회로</div>
  </div>

  <figure>
    <svg viewBox="0 0 600 260" role="img" aria-label="우노 TX에서 나온 5V 신호가 R1을 지나 접점에서 3.3V로 낮아지고, 그 접점에서 ESP32 RX로 신호가 들어가며, 동시에 R2를 거쳐 GND로 전류가 흐르는 회로도">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <polygon points="0,0 10,5 0,10" fill="currentColor"></polygon>
        </marker>
      </defs>
      <g stroke="currentColor" fill="none" color="var(--wire)">
        <!-- Uno box -->
        <rect x="20" y="70" width="90" height="48" rx="6" fill="var(--surface)" stroke="var(--line)"></rect>
        <!-- ESP32 box -->
        <rect x="480" y="30" width="100" height="48" rx="6" fill="var(--surface)" stroke="var(--line)"></rect>
        <!-- GND rail -->
        <line x1="60" y1="220" x2="540" y2="220" stroke="var(--line)" stroke-width="2"></line>

        <!-- Uno TX -> R1 -->
        <line x1="110" y1="94" x2="200" y2="94" marker-end="url(#arrow)"></line>
      </g>

      <!-- R1 resistor -->
      <g stroke="var(--ink)" fill="none" stroke-width="2">
        <path d="M200,94 l8,-10 l12,20 l12,-20 l12,20 l12,-20 l12,20 l8,-10" />
      </g>
      <line x1="280" y1="94" x2="330" y2="94" stroke="currentColor" color="var(--wire)" marker-end="url(#arrow)"></line>

      <!-- junction node -->
      <circle cx="330" cy="94" r="4.5" fill="var(--accent)"></circle>

      <!-- node -> ESP32 RX -->
      <line x1="330" y1="94" x2="330" y2="54" stroke="currentColor" color="var(--wire)"></line>
      <line x1="330" y1="54" x2="480" y2="54" stroke="currentColor" color="var(--wire)" marker-end="url(#arrow)"></line>

      <!-- node -> down -> R2 -> GND -->
      <line x1="330" y1="94" x2="330" y2="150" stroke="currentColor" color="var(--wire)"></line>
      <g stroke="var(--ink)" fill="none" stroke-width="2">
        <path d="M330,150 l-10,8 l20,12 l-20,12 l20,12 l-20,12 l20,12 l-10,8" />
      </g>
      <line x1="330" y1="220" x2="330" y2="220" stroke="currentColor" color="var(--wire)"></line>
      <line x1="330" y1="218" x2="330" y2="220" stroke="currentColor" color="var(--wire)"></line>

      <!-- Uno GND -> rail -->
      <line x1="60" y1="118" x2="60" y2="220" stroke="currentColor" color="var(--wire)"></line>
      <!-- ESP32 GND -> rail (direct, no resistor) -->
      <line x1="500" y1="78" x2="500" y2="220" stroke="currentColor" color="var(--wire)"></line>

      <!-- labels -->
      <text x="65" y="98" font-size="13" fill="var(--ink)" font-weight="600">UNO</text>
      <text x="65" y="112" font-size="10" fill="var(--ink-dim)">TX pin</text>
      <text x="505" y="58" font-size="13" fill="var(--ink)" font-weight="600">ESP32</text>
      <text x="505" y="70" font-size="10" fill="var(--ink-dim)">RX pin</text>

      <text x="240" y="80" font-size="12" fill="var(--ink)" text-anchor="middle">R1</text>
      <text x="240" y="128" font-size="11" fill="var(--ink-dim)" text-anchor="middle">220Ω</text>

      <text x="352" y="185" font-size="12" fill="var(--ink)">R2</text>
      <text x="352" y="200" font-size="11" fill="var(--ink-dim)">440Ω</text>

      <text x="345" y="88" font-size="11" fill="var(--accent)" font-weight="700">접점 (약 3.3V)</text>

      <text x="70" y="240" font-size="11" fill="var(--ink-dim)">GND (공통)</text>
      <text x="330" y="240" font-size="11" fill="var(--ink-dim)" text-anchor="middle">GND</text>

      <text x="18" y="60" font-size="11" fill="var(--danger)" font-weight="600">5V 신호</text>
      <text x="480" y="20" font-size="11" fill="var(--safe)" font-weight="600">3.3V만 허용</text>
    </svg>
    <figcaption>
      우노 TX의 5V 신호가 R1(220Ω)을 지나며 전압이 낮아지고, 그 접점(주황 점)의 전압(약 3.3V)이 ESP32 RX로 들어갑니다. 같은 접점에서 R2(440Ω)를 통해 GND로 전류가 흐르며 전압을 고정합니다. ESP32의 GND 핀은 저항 없이 공통 GND에 직결됩니다.
    </figcaption>
  </figure>

  <table>
    <thead>
      <tr><th>지점</th><th>전압</th><th>비고</th></tr>
    </thead>
    <tbody>
      <tr><td>우노 TX</td><td class="v">5V</td><td><span class="tag danger">그대로 두면 위험</span></td></tr>
      <tr><td>접점 (R1↔R2)</td><td class="v">≈ 3.3V</td><td><span class="tag safe">ESP32 RX로 연결</span></td></tr>
      <tr><td>ESP32 GND</td><td class="v">0V</td><td>저항 없이 공통 GND 직결</td></tr>
    </tbody>
  </table>
</main>
