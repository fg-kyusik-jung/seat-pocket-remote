<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>좌판 경도 조절 시스템 — UI 데모</title>
<style>
:root {
  --bg: #e9e4da;
  --bg-grain: #e2ddd1;
  --ink: #2a251d;
  --ink-dim: #6b6459;
  --card: #f4f0e6;
  --card-border: #d8d0bf;
  --device: #29282b;
  --device-edge: #38373a;
  --accent: #b5722e;
  --accent-soft: #e7c9a2;
  --led-off: #4a4742;
  --lcd-bg-off: #6f7d68;
  --lcd-bg-on: #9fd28f;
  --lcd-text: #1c3018;
  --lcd-glow: rgba(159, 210, 143, 0.35);
  --key: #3f3e42;
  --key-top: #4b4a4e;
  --key-text: #eae6da;
  --good: #5e8f52;
  --bad: #b1503f;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, "Roboto Mono", monospace;
  --sans: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #171511;
    --bg-grain: #1c1a15;
    --ink: #ece7db;
    --ink-dim: #9b9284;
    --card: #211f1a;
    --card-border: #383429;
    --device: #17171a;
    --device-edge: #2b2a2e;
    --accent: #d99a54;
    --accent-soft: #4a3822;
    --led-off: #38352f;
    --lcd-bg-off: #565f51;
    --lcd-bg-on: #8fcf7c;
    --lcd-text: #16260f;
    --lcd-glow: rgba(143, 207, 124, 0.4);
    --key: #29282c;
    --key-top: #333237;
    --key-text: #ece7db;
  }
}
:root[data-theme="dark"] {
  --bg: #171511; --bg-grain: #1c1a15; --ink: #ece7db; --ink-dim: #9b9284;
  --card: #211f1a; --card-border: #383429; --device: #17171a; --device-edge: #2b2a2e;
  --accent: #d99a54; --accent-soft: #4a3822; --led-off: #38352f;
  --lcd-bg-off: #565f51; --lcd-bg-on: #8fcf7c; --lcd-text: #16260f; --lcd-glow: rgba(143, 207, 124, 0.4);
  --key: #29282c; --key-top: #333237; --key-text: #ece7db;
}
:root[data-theme="light"] {
  --bg: #e9e4da; --bg-grain: #e2ddd1; --ink: #2a251d; --ink-dim: #6b6459;
  --card: #f4f0e6; --card-border: #d8d0bf; --device: #29282b; --device-edge: #38373a;
  --accent: #b5722e; --accent-soft: #e7c9a2; --led-off: #4a4742;
  --lcd-bg-off: #6f7d68; --lcd-bg-on: #9fd28f; --lcd-text: #1c3018; --lcd-glow: rgba(159, 210, 143, 0.35);
  --key: #3f3e42; --key-top: #4b4a4e; --key-text: #eae6da;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at top, var(--bg-grain), var(--bg) 65%);
  color: var(--ink);
  font-family: var(--sans);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2.5rem 1.25rem 3rem;
  gap: 1.75rem;
}

header {
  text-align: center;
  max-width: 34rem;
}
h1 {
  font-size: 1.4rem;
  font-weight: 650;
  letter-spacing: -0.01em;
  text-wrap: balance;
  margin: 0 0 0.4rem;
}
.status-row {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  font-size: 0.8rem;
  color: var(--ink-dim);
  font-family: var(--mono);
}
.status-dot {
  width: 0.5rem;
  height: 0.5rem;
  border-radius: 50%;
  background: var(--bad);
  transition: background 0.2s;
}
.status-dot.ok { background: var(--good); }

.device-card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 20px;
  padding: 1.5rem;
  box-shadow: 0 18px 40px -20px rgba(0,0,0,0.35);
}

.device {
  background: linear-gradient(160deg, var(--device), var(--device-edge));
  border-radius: 14px;
  padding: 1.5rem 1.75rem 1.75rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.4rem;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), inset 0 -2px 6px rgba(0,0,0,0.4);
}

/* ---- LCD ---- */
.lcd-bezel {
  background: #0e0f0d;
  border-radius: 6px;
  padding: 10px 12px;
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
}
.lcd-screen {
  background: var(--lcd-bg-off);
  border-radius: 2px;
  padding: 10px 12px;
  font-family: var(--mono);
  font-size: 1.05rem;
  line-height: 1.55;
  letter-spacing: 0.09em;
  color: var(--lcd-text);
  white-space: pre;
  transition: background 0.12s ease, box-shadow 0.12s ease;
  min-width: 15ch;
}
.lcd-screen.on {
  background: var(--lcd-bg-on);
  box-shadow: 0 0 22px var(--lcd-glow);
}
.lcd-line { min-height: 1.3em; }

/* ---- LEDs ---- */
.led-row {
  display: flex;
  gap: 1.4rem;
}
.led-unit {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.35rem;
}
.led {
  width: 0.85rem;
  height: 0.85rem;
  border-radius: 50%;
  background: var(--led-off);
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
  transition: background 0.15s, box-shadow 0.15s;
}
.led.lit {
  background: #f0a94e;
  box-shadow: 0 0 10px 2px rgba(240, 169, 78, 0.75), inset 0 1px 2px rgba(0,0,0,0.2);
}
.led-label {
  font-family: var(--mono);
  font-size: 0.68rem;
  color: #9a968c;
  letter-spacing: 0.05em;
}

/* ---- 포켓/밸브/모터 하드웨어 시각화 ---- */
.hw-panel {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.6rem;
}
.pockets-row {
  display: flex;
  gap: 1.1rem;
  align-items: flex-end;
}
.pocket-unit {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.4rem;
}
.pocket-bar {
  width: 1.7rem;
  height: 4.6rem;
  border-radius: 7px;
  background: #131211;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.07), inset 0 2px 5px rgba(0,0,0,0.5);
  display: flex;
  align-items: flex-end;
  overflow: hidden;
}
.pocket-fill {
  width: 100%;
  height: 10%;
  border-radius: 5px 5px 0 0;
  background: linear-gradient(180deg, #eec27f, var(--accent));
  transition: height 0.18s ease-out;
}
.pocket-valve-led {
  width: 0.42rem;
  height: 0.42rem;
  border-radius: 50%;
  background: var(--led-off);
  transition: background 0.1s, box-shadow 0.1s;
}
.pocket-valve-led.open {
  background: #74cdea;
  box-shadow: 0 0 7px 1.5px rgba(116, 205, 234, 0.8);
}
.pocket-label {
  font-family: var(--mono);
  font-size: 0.62rem;
  color: #8f8b80;
}
.motor-row {
  display: flex;
  gap: 3rem;
}
.motor-unit {
  display: flex;
  align-items: center;
  gap: 0.35rem;
}
.motor-led {
  width: 0.5rem;
  height: 0.5rem;
  border-radius: 50%;
  background: var(--led-off);
  transition: background 0.1s, box-shadow 0.1s;
}
.motor-led.on {
  background: #7fd858;
  box-shadow: 0 0 8px 2px rgba(127, 216, 88, 0.8);
}
.motor-label {
  font-family: var(--mono);
  font-size: 0.65rem;
  color: #8f8b80;
  letter-spacing: 0.04em;
}

/* ---- Encoder ---- */
.encoder-row {
  display: flex;
  align-items: center;
  gap: 1.1rem;
}
.rot-btn {
  width: 2.4rem;
  height: 2.4rem;
  border-radius: 50%;
  border: none;
  background: radial-gradient(circle at 35% 30%, var(--key-top), var(--key));
  color: var(--key-text);
  font-size: 1.1rem;
  cursor: pointer;
  box-shadow: 0 3px 0 rgba(0,0,0,0.35), 0 4px 8px rgba(0,0,0,0.3);
  transition: transform 0.06s, box-shadow 0.06s;
}
.rot-btn:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 rgba(0,0,0,0.35);
}
.knob-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.4rem;
}
.knob {
  width: 4.4rem;
  height: 4.4rem;
  border-radius: 50%;
  background: radial-gradient(circle at 32% 28%, #6b6863, #232224 70%);
  box-shadow: 0 5px 0 rgba(0,0,0,0.4), 0 8px 16px rgba(0,0,0,0.35), inset 0 0 0 3px rgba(255,255,255,0.05);
  position: relative;
  cursor: pointer;
  user-select: none;
  transition: transform 0.08s;
}
.knob:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.4); }
.knob-hint {
  font-family: var(--mono);
  font-size: 0.62rem;
  color: #8f8b80;
  letter-spacing: 0.04em;
}

/* ---- Preset buttons ---- */
.preset-row {
  display: flex;
  gap: 0.9rem;
}
.preset-btn {
  width: 3rem;
  height: 2.1rem;
  border-radius: 7px;
  border: none;
  background: linear-gradient(180deg, var(--key-top), var(--key));
  color: var(--key-text);
  font-family: var(--mono);
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 3px 0 rgba(0,0,0,0.35), 0 4px 8px rgba(0,0,0,0.3);
  transition: transform 0.06s, box-shadow 0.06s;
}
.preset-btn:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 rgba(0,0,0,0.35);
}

.legend {
  max-width: 30rem;
  font-size: 0.82rem;
  color: var(--ink-dim);
  text-align: center;
  line-height: 1.7;
}
.legend b { color: var(--ink); font-weight: 600; }
kbd {
  font-family: var(--mono);
  font-size: 0.78em;
  background: var(--card);
  border: 1px solid var(--card-border);
  border-bottom-width: 2px;
  border-radius: 4px;
  padding: 0.05em 0.4em;
}

@media (prefers-reduced-motion: reduce) {
  .lcd-screen, .rot-btn, .preset-btn, .knob { transition: none; }
}
</style>
</head>
<body>

<header>
  <h1>좌판 경도 조절 시스템 — UI 데모</h1>
  <div class="status-row"><span class="status-dot" id="statusDot"></span><span id="statusText">연결 중...</span></div>
</header>

<div class="device-card">
  <div class="device">
    <div class="lcd-bezel">
      <div class="lcd-screen" id="lcdScreen">
        <div class="lcd-line" id="lcdLine0">&nbsp;</div>
        <div class="lcd-line" id="lcdLine1">&nbsp;</div>
      </div>
    </div>

    <div class="hw-panel">
      <div class="pockets-row">
        <div class="pocket-unit"><div class="pocket-bar"><div class="pocket-fill" id="pocketFill0"></div></div><div class="pocket-valve-led" id="valveLed0"></div><div class="pocket-label">1</div></div>
        <div class="pocket-unit"><div class="pocket-bar"><div class="pocket-fill" id="pocketFill1"></div></div><div class="pocket-valve-led" id="valveLed1"></div><div class="pocket-label">2</div></div>
        <div class="pocket-unit"><div class="pocket-bar"><div class="pocket-fill" id="pocketFill2"></div></div><div class="pocket-valve-led" id="valveLed2"></div><div class="pocket-label">3</div></div>
        <div class="pocket-unit"><div class="pocket-bar"><div class="pocket-fill" id="pocketFill3"></div></div><div class="pocket-valve-led" id="valveLed3"></div><div class="pocket-label">4</div></div>
      </div>
      <div class="motor-row">
        <div class="motor-unit"><div class="motor-led" id="motorLed0"></div><div class="motor-label">MOTOR 1</div></div>
        <div class="motor-unit"><div class="motor-led" id="motorLed1"></div><div class="motor-label">MOTOR 2</div></div>
      </div>
    </div>

    <div class="led-row">
      <div class="led-unit"><div class="led" id="led0"></div><div class="led-label">1</div></div>
      <div class="led-unit"><div class="led" id="led1"></div><div class="led-label">2</div></div>
      <div class="led-unit"><div class="led" id="led2"></div><div class="led-label">3</div></div>
    </div>

    <div class="encoder-row">
      <button class="rot-btn" id="ccwBtn" aria-label="반시계 방향 회전">◀</button>
      <div class="knob-wrap">
        <div class="knob" id="knob"></div>
        <div class="knob-hint">누르기=클릭 · 길게=전원</div>
      </div>
      <button class="rot-btn" id="cwBtn" aria-label="시계 방향 회전">▶</button>
    </div>

    <div class="preset-row">
      <button class="preset-btn" data-preset="0">P1</button>
      <button class="preset-btn" data-preset="1">P2</button>
      <button class="preset-btn" data-preset="2">P3</button>
    </div>
  </div>
</div>

<p class="legend">
  <b>◀ ▶</b> 또는 키보드 <kbd>←</kbd><kbd>→</kbd> = 엔코더 회전 · <b>노브 클릭</b> 또는 <kbd>Space</kbd> = 짧게/길게/더블클릭(실제 펌웨어와 동일 타이밍) · <b>P1~P3</b> 또는 <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> = 프리셋 불러오기
</p>

<script>
const lcdScreen = document.getElementById("lcdScreen");
const lcdLine0 = document.getElementById("lcdLine0");
const lcdLine1 = document.getElementById("lcdLine1");
const leds = [document.getElementById("led0"), document.getElementById("led1"), document.getElementById("led2")];
const pocketFills = [0, 1, 2, 3].map((i) => document.getElementById(`pocketFill${i}`));
const valveLeds = [0, 1, 2, 3].map((i) => document.getElementById(`valveLed${i}`));
const motorLeds = [0, 1].map((i) => document.getElementById(`motorLed${i}`));
const knob = document.getElementById("knob");
const statusDot = document.getElementById("statusDot");
const statusText = document.getElementById("statusText");

let ws = null;

function connect() {
  ws = new WebSocket(`ws://${location.hostname}:8766/`);
  ws.onopen = () => { statusDot.classList.add("ok"); statusText.textContent = "연결됨"; };
  ws.onclose = () => { statusDot.classList.remove("ok"); statusText.textContent = "연결 끊김 - 재시도 중..."; setTimeout(connect, 1000); };
  ws.onerror = () => ws.close();
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === "state") render(msg);
    else if (msg.type === "event") handleEvent(msg);
  };
}

function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

function render(s) {
  lcdLine0.textContent = s.lcd0.replace(/ /g, " ");
  lcdLine1.textContent = s.lcd1.replace(/ /g, " ");
  lcdScreen.classList.toggle("on", s.backlight);
  s.leds.forEach((on, i) => leds[i].classList.toggle("lit", on));
  (s.levels || []).forEach((lvl, i) => { pocketFills[i].style.height = `${Math.max(6, lvl * 10)}%`; });
  (s.valves || []).forEach((open, i) => valveLeds[i].classList.toggle("open", open));
  (s.motors || []).forEach((on, i) => motorLeds[i].classList.toggle("on", on));
}

function beep(freq, ms) {
  try {
    const ctx = beep.ctx || (beep.ctx = new (window.AudioContext || window.webkitAudioContext)());
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "square";
    osc.frequency.value = freq;
    gain.gain.value = 0.05;
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + ms / 1000);
  } catch (e) {}
}

function handleEvent(msg) {
  if (msg.name === "beep") beep(msg.freq, msg.ms);
  else if (msg.name === "chime") {
    const notes = [262, 330, 392, 523];
    notes.forEach((f, i) => setTimeout(() => beep(f, 90), i * 100));
  }
}

function rotate(dir) {
  send({ cmd: "rotate", dir });
}

document.getElementById("cwBtn").addEventListener("click", () => rotate(1));
document.getElementById("ccwBtn").addEventListener("click", () => rotate(-1));

function pressDown() { send({ cmd: "press_down" }); }
function pressUp() { send({ cmd: "press_up" }); }
knob.addEventListener("mousedown", pressDown);
knob.addEventListener("mouseup", pressUp);
knob.addEventListener("mouseleave", (e) => { if (e.buttons & 1) pressUp(); });
knob.addEventListener("touchstart", (e) => { e.preventDefault(); pressDown(); }, { passive: false });
knob.addEventListener("touchend", (e) => { e.preventDefault(); pressUp(); }, { passive: false });

document.querySelectorAll(".preset-btn").forEach((btn) => {
  btn.addEventListener("click", () => send({ cmd: "preset", idx: parseInt(btn.dataset.preset, 10) }));
});

let spaceDown = false;
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") { rotate(1); }
  else if (e.key === "ArrowLeft") { rotate(-1); }
  else if (e.key === " " && !spaceDown) { spaceDown = true; pressDown(); }
  else if (e.key === "1") send({ cmd: "preset", idx: 0 });
  else if (e.key === "2") send({ cmd: "preset", idx: 1 });
  else if (e.key === "3") send({ cmd: "preset", idx: 2 });
});
document.addEventListener("keyup", (e) => {
  if (e.key === " ") { spaceDown = false; pressUp(); }
});

connect();
</script>
</body>
</html>
