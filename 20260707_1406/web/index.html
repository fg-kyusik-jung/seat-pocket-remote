<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>좌판 경도 조절 - 실험용 대시보드</title>
<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; background: #111; color: #eee; margin: 0; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  #status { font-size: 13px; margin-bottom: 16px; }
  #status.connected { color: #4caf50; }
  #status.disconnected { color: #f44336; }
  canvas { background: #1a1a1a; border: 1px solid #333; border-radius: 4px; width: 100%; height: 260px; }
  table { border-collapse: collapse; margin-top: 16px; width: 100%; }
  th, td { border: 1px solid #333; padding: 6px 10px; text-align: center; font-size: 13px; }
  th { background: #1e1e1e; }
  button { background: #2a2a2a; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
  button:hover { background: #3a3a3a; }
  button.on { background: #2d5c2d; border-color: #4caf50; }
  .panel { margin-top: 20px; padding: 12px; background: #1a1a1a; border: 1px solid #333; border-radius: 4px; }
  .panel h2 { font-size: 14px; margin: 0 0 10px; }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  input[type=number] { width: 70px; background: #222; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 4px 6px; }
  a.download { color: #64b5f6; text-decoration: none; font-size: 13px; }
</style>
</head>
<body>
  <h1>좌판 경도 조절 시스템 - 실험용 대시보드</h1>
  <div id="status" class="disconnected">연결 안됨</div>

  <canvas id="chart" width="1000" height="260"></canvas>

  <table id="sectorTable">
    <thead>
      <tr><th>섹터</th><th>Raw (0-1023)</th><th>전압 (V)</th><th>밸브</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="panel">
    <h2>펌프 제어 (공용)</h2>
    <div class="row">
      <label>현재 속도 (가변저항으로 조절)</label>
      <strong id="pumpSpeedPct">-</strong>
    </div>
    <div class="row">
      <label>방향</label>
      <select id="pumpDir">
        <option value="0">정방향 (A)</option>
        <option value="1">역방향 (B)</option>
      </select>
      <button id="pumpDirApply">방향 적용</button>
    </div>
  </div>

  <div class="panel">
    <h2>로그</h2>
    <a class="download" href="/download">현재 실험 CSV 다운로드</a>
    &nbsp;|&nbsp;
    <button id="statusBtn">STATUS 조회</button>
  </div>

<script>
const MAX_POINTS = 300;
const COLORS = ["#4caf50", "#2196f3", "#ff9800", "#e91e63", "#9c27b0", "#00bcd4"];

let sectorCount = null;
let history = [];  // history[i] = array of recent raw values for sector i
let valveState = [];

const statusEl = document.getElementById("status");
const canvas = document.getElementById("chart");
const ctx = canvas.getContext("2d");
const tbody = document.querySelector("#sectorTable tbody");

function setStatus(connected, text) {
  statusEl.textContent = text;
  statusEl.className = connected ? "connected" : "disconnected";
}

function ensureSectors(n) {
  if (sectorCount !== null) return;
  sectorCount = n;
  history = Array.from({length: n}, () => []);
  valveState = Array.from({length: n}, () => 0);

  tbody.innerHTML = "";
  for (let i = 0; i < n; i++) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${i}</td>
      <td id="raw-${i}">-</td>
      <td id="volt-${i}">-</td>
      <td><button id="valve-${i}">닫힘</button></td>
    `;
    tbody.appendChild(tr);
    document.getElementById(`valve-${i}`).addEventListener("click", () => toggleValve(i));
  }
}

function toggleValve(i) {
  valveState[i] = valveState[i] ? 0 : 1;
  const btn = document.getElementById(`valve-${i}`);
  btn.textContent = valveState[i] ? "열림" : "닫힘";
  btn.className = valveState[i] ? "on" : "";
  send({cmd: "valve", idx: i, state: valveState[i]});
}

function updateTelemetry(values) {
  ensureSectors(values.length);
  for (let i = 0; i < values.length; i++) {
    history[i].push(values[i]);
    if (history[i].length > MAX_POINTS) history[i].shift();
    document.getElementById(`raw-${i}`).textContent = values[i];
    document.getElementById(`volt-${i}`).textContent = (values[i] * 5.0 / 1023.0).toFixed(3);
  }
  drawChart();
}

function drawChart() {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = "#333";
  ctx.beginPath();
  for (let g = 0; g <= 4; g++) {
    const y = h * g / 4;
    ctx.moveTo(0, y);
    ctx.lineTo(w, y);
  }
  ctx.stroke();

  history.forEach((series, i) => {
    if (series.length < 2) return;
    ctx.strokeStyle = COLORS[i % COLORS.length];
    ctx.lineWidth = 2;
    ctx.beginPath();
    series.forEach((v, idx) => {
      const x = (idx / (MAX_POINTS - 1)) * w;
      const y = h - (v / 1023) * h;
      if (idx === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
  });
}

let ws;
function connect() {
  ws = new WebSocket(`ws://${location.hostname}:8765/`);
  ws.onopen = () => setStatus(true, "연결됨");
  ws.onclose = () => { setStatus(false, "연결 끊김 - 재시도중..."); setTimeout(connect, 1500); };
  ws.onerror = () => ws.close();
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === "telemetry") updateTelemetry(msg.values);
    else if (msg.type === "motor") updateMotor(msg.speed);
    else if (msg.type === "ready") console.log("READY", msg.num_sectors);
  };
}

function updateMotor(speed) {
  const pct = Math.round((speed / 255) * 100);
  document.getElementById("pumpSpeedPct").textContent = `${pct}%`;
}

function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

document.getElementById("pumpDirApply").addEventListener("click", () => {
  const dir = parseInt(document.getElementById("pumpDir").value, 10);
  send({cmd: "pump", dir});
});
document.getElementById("statusBtn").addEventListener("click", () => send({cmd: "status"}));

connect();
</script>
</body>
</html>
